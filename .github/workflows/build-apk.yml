name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Restore platform files (regenerate missing gradle wrapper, etc.)
        # 补齐 flutter create 生成的二进制/模板文件（gradle-wrapper.jar 等无法手写的文件）
        run: flutter create --platforms=android --org com.songhelp --project-name songhelp .

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK (armeabi-v7a 32位)
        run: flutter build apk --release --target-platform android-arm

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: songhelp-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30